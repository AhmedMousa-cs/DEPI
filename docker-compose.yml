services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: mapms
      POSTGRES_USER: mapms
      POSTGRES_PASSWORD: mapms_dev_password
    ports:
      - "5435:5432"
    volumes:
      - mapms_postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mapms -d mapms"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mapms_postgres_data:
