name: CI

# Every push and every PR must pass the backend suite, the deterministic evals and the
# frontend syntax gate. No secrets are required: the LLM is never called in tests.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      db:
        # Same image as docker-compose.yml (PostgreSQL 16 + pgvector).
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: ci-password
          # conftest.py always forces the database name to nexus_test, so create it here.
          POSTGRES_DB: nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://nexus:ci-password@localhost:5432/nexus_test
      TEST_DATABASE_URL: postgresql+psycopg://nexus:ci-password@localhost:5432/nexus_test
      JWT_SECRET: ci-only-secret-not-used-anywhere-else
      # Tests must never reach a provider; an empty key makes any accidental call fail loudly.
      GROQ_API_KEY: ""
      LLM_REQUIRE_PRICING: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Single Alembic head
        working-directory: backend
        run: |
          heads=$(python -m alembic heads | grep -c '(head)' || true)
          echo "Alembic heads: $heads"
          test "$heads" -eq 1

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q

  evals:
    name: Deterministic evals
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            evals/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r evals/requirements.txt

      # Golden projects A/B/C, the scheduling pipeline and the Agent 4 tool-correctness
      # suite. All deterministic: no API key, no network.
      - name: Run golden evals
        run: PYTHONPATH=backend python -m pytest evals/tests -q

  frontend:
    name: Frontend syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Parse check (app.js, auth.js)
        run: |
          node --check frontend/app.js
          node --check frontend/auth.js
